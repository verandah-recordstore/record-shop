<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Sample Record Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f4f4f6;
      color: #222;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: #111;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header .logo {
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 14px;
      text-transform: uppercase;
    }

    header .nav-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    header .nav-right button {
      border: 1px solid #555;
      background: transparent;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }

    header .nav-right button:hover {
      background: #fff;
      color: #111;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr minmax(260px, 320px);
      gap: 20px;
      padding: 16px 20px 40px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .filters-and-products {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filters {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filters label {
      font-size: 12px;
      color: #666;
    }

    .filters input,
    .filters select {
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid #ccc;
      font-size: 12px;
      background: #fafafa;
    }

    .filters .search-input {
      flex: 1;
      min-width: 140px;
    }

    .products {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: #fafafa;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #555;
      text-align: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }

    .product-title {
      font-weight: 600;
      font-size: 13px;
    }

    .product-artist {
      color: #555;
      font-size: 12px;
    }

    .product-label {
      color: #888;
      font-size: 11px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .product-price {
      font-weight: 700;
      font-size: 13px;
    }

    .product-condition {
      font-size: 11px;
      color: #666;
    }

    .product-card button {
      margin-top: 6px;
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      width: 100%;
    }

    .product-card button:hover {
      opacity: 0.85;
    }

    .cart {
      background: #111;
      color: #fff;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 64px;
      max-height: calc(100vh - 80px);
      overflow: hidden;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .cart-header h2 {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .cart-header span {
      font-size: 11px;
      color: #aaa;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin: 4px 0;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px;
      padding: 6px 0;
      border-bottom: 1px solid #333;
      font-size: 11px;
    }

    .cart-item-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cart-item-title {
      font-weight: 500;
      font-size: 12px;
    }

    .cart-item-artist {
      color: #aaa;
      font-size: 11px;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
    }

    .cart-item-controls button {
      border-radius: 999px;
      border: 1px solid #555;
      background: transparent;
      color: #fff;
      padding: 0 6px;
      font-size: 11px;
      cursor: pointer;
      height: 22px;
    }

    .cart-item-controls button:hover {
      background: #fff;
      color: #111;
    }

    .cart-summary {
      border-top: 1px solid #333;
      padding-top: 8px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cart-summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-summary-total {
      font-weight: 700;
      font-size: 14px;
    }

    .cart button.checkout {
      margin-top: 6px;
      border-radius: 999px;
      border: none;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      background: #f5f5f5;
      color: #111;
      cursor: pointer;
    }

    .cart button.checkout:hover {
      background: #fff;
    }

    .cart-empty {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      padding: 20px 0;
    }

    footer {
      padding: 12px 20px 24px;
      font-size: 11px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">RECORD SHOP / EC SAMPLE</div>
    <div class="nav-right">
      <span style="font-size:11px; color:#ccc;">Online Store Demo</span>
      <button type="button" onclick="scrollToProducts()">商品一覧</button>
    </div>
  </header>

  <main class="layout">
    <section class="filters-and-products">
      <div class="filters">
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="アーティスト / タイトル / レーベルで検索"
        />
        <label>
          フォーマット
          <select id="formatFilter">
            <option value="">All</option>
            <option value="12inch">12&quot;</option>
            <option value="LP">LP</option>
            <option value="EP">EP</option>
          </select>
        </label>
        <label>
          並び替え
          <select id="sortBy">
            <option value="newest">新着順</option>
            <option value="price-asc">価格の安い順</option>
            <option value="price-desc">価格の高い順</option>
            <option value="artist">アーティスト名</option>
          </select>
        </label>
      </div>

      <section class="products" id="product-list">
        <!-- JSで商品カードを描画 -->
      </section>
    </section>

    <aside class="cart" id="cart">
      <div class="cart-header">
        <h2>CART</h2>
        <span id="cart-count">0 items</span>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-summary">
        <div class="cart-summary-row">
          <span>小計</span>
          <span id="cart-subtotal">¥0</span>
        </div>
        <div class="cart-summary-row">
          <span>送料（ダミー）</span>
          <span id="cart-shipping">¥0</span>
        </div>
        <div class="cart-summary-row">
          <span class="cart-summary-total-label">合計</span>
          <span class="cart-summary-total" id="cart-total">¥0</span>
        </div>
        <button class="checkout" type="button" onclick="checkout()">
          チェックアウト（ダミー）
        </button>
      </div>
    </aside>
  </main>

  <footer>
    このページはレコード屋ECサイトのデモです。実際の決済機能は実装されていません。<br />
    コードを書き換えてショップ名や商品を差し替えて使ってください。
  </footer>

  <script>
    // ------------- ダミー商品データ -------------
    const products = [
      {
        id: "ATPC-001",
        artist: "Various Artists",
        title: "Deep Minimal Grooves EP",
        label: "Atipic Lab",
        price: 2200,
        format: "12inch",
        condition: "New",
        stock: 3,
        image: "", // 必要なら画像URLを入れる
        createdAt: "2025-11-20"
      },
      {
        id: "VRNDH-002",
        artist: "Dubtil",
        title: "Verandah Nights",
        label: "Verandah",
        price: 2600,
        format: "12inch",
        condition: "New",
        stock: 5,
        image: "",
        createdAt: "2025-11-28"
      },
      {
        id: "MINML-010",
        artist: "Barac",
        title: "Subtle Movements LP",
        label: "Minimal Essence",
        price: 4200,
        format: "LP",
        condition: "New",
        stock: 2,
        image: "",
        createdAt: "2025-10-10"
      },
      {
        id: "CLSSC-100",
        artist: "Larry Heard",
        title: "Deep House Classic EP",
        label: "Classic House",
        price: 2000,
        format: "EP",
        condition: "Used / EX",
        stock: 1,
        image: "",
        createdAt: "2025-09-01"
      },
      {
        id: "USED-777",
        artist: "Ricardo Villalobos",
        title: "Fizheuer Zieheuer",
        label: "Cadenza",
        price: 4800,
        format: "12inch",
        condition: "Used / VG+",
        stock: 1,
        image: "",
        createdAt: "2025-08-15"
      }
    ];

    // ------------- カート管理 -------------
    let cart = {};

    function loadCartFromStorage() {
      try {
        const saved = localStorage.getItem("record-shop-cart");
        if (saved) {
          cart = JSON.parse(saved);
        }
      } catch (e) {
        cart = {};
      }
    }

    function saveCartToStorage() {
      try {
        localStorage.setItem("record-shop-cart", JSON.stringify(cart));
      } catch (e) {
        // 無視
      }
    }

    function addToCart(productId) {
      const product = products.find((p) => p.id === productId);
      if (!product) return;

      const currentQty = cart[productId]?.qty || 0;
      if (currentQty + 1 > product.stock) {
        alert("在庫数を超えています。");
        return;
      }

      cart[productId] = {
        product,
        qty: currentQty + 1
      };
      saveCartToStorage();
      renderCart();
    }

    function changeCartQty(productId, delta) {
      if (!cart[productId]) return;
      const newQty = cart[productId].qty + delta;
      if (newQty <= 0) {
        delete cart[productId];
      } else {
        const product = cart[productId].product;
        if (newQty > product.stock) {
          alert("在庫数を超えています。");
          return;
        }
        cart[productId].qty = newQty;
      }
      saveCartToStorage();
      renderCart();
    }

    function removeFromCart(productId) {
      if (!cart[productId]) return;
      delete cart[productId];
      saveCartToStorage();
      renderCart();
    }

    function formatYen(value) {
      return "¥" + value.toLocaleString("ja-JP");
    }

    function renderCart() {
      const cartItemsContainer = document.getElementById("cart-items");
      const cartCount = document.getElementById("cart-count");
      const cartSubtotal = document.getElementById("cart-subtotal");
      const cartShipping = document.getElementById("cart-shipping");
      const cartTotal = document.getElementById("cart-total");

      const entries = Object.values(cart);
      if (entries.length === 0) {
        cartItemsContainer.innerHTML = '<div class="cart-empty">カートは空です。</div>';
        cartCount.textContent = "0 items";
        cartSubtotal.textContent = "¥0";
        cartShipping.textContent = "¥0";
        cartTotal.textContent = "¥0";
        return;
      }

      let totalItems = 0;
      let subtotal = 0;

      cartItemsContainer.innerHTML = "";
      for (const entry of entries) {
        const { product, qty } = entry;
        totalItems += qty;
        subtotal += product.price * qty;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <div class="cart-item-main">
            <div class="cart-item-title">${product.title}</div>
            <div class="cart-item-artist">${product.artist} / ${product.label}</div>
            <div>${formatYen(product.price)} × ${qty}</div>
          </div>
          <div class="cart-item-controls">
            <button type="button" onclick="changeCartQty('${product.id}', -1)">-</button>
            <span>${qty}</span>
            <button type="button" onclick="changeCartQty('${product.id}', 1)">+</button>
            <button type="button" onclick="removeFromCart('${product.id}')">削除</button>
          </div>
        `;
        cartItemsContainer.appendChild(div);
      }

      cartCount.textContent = `${totalItems} item${totalItems > 1 ? "s" : ""}`;
      cartSubtotal.textContent = formatYen(subtotal);

      // 送料はダミー（例：5,000円以上で無料）
      const shipping = subtotal >= 5000 || subtotal === 0 ? 0 : 800;
      cartShipping.textContent = formatYen(shipping);
      cartTotal.textContent = formatYen(subtotal + shipping);
    }

    // ------------- 商品一覧描画 -------------
    function sortProducts(list, sortBy) {
      const sorted = [...list];
      switch (sortBy) {
        case "price-asc":
          sorted.sort((a, b) => a.price - b.price);
          break;
        case "price-desc":
          sorted.sort((a, b) => b.price - a.price);
          break;
        case "artist":
          sorted.sort((a, b) => a.artist.localeCompare(b.artist, "ja"));
          break;
        case "newest":
        default:
          sorted.sort(
            (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
          );
          break;
      }
      return sorted;
    }

    function renderProducts() {
      const listContainer = document.getElementById("product-list");
      const searchValue = document.getElementById("search").value.trim().toLowerCase();
      const formatValue = document.getElementById("formatFilter").value;
      const sortBy = document.getElementById("sortBy").value;

      let filtered = products.filter((p) => {
        const text =
          (p.artist + " " + p.title + " " + p.label).toLowerCase();
        const matchesSearch =
          searchValue === "" || text.includes(searchValue);
        const matchesFormat =
          !formatValue || p.format === formatValue;

        return matchesSearch && matchesFormat;
      });

      filtered = sortProducts(filtered, sortBy);

      listContainer.innerHTML = "";
      if (filtered.length === 0) {
        listContainer.innerHTML =
          '<div style="font-size:13px; color:#666;">該当する商品がありません。</div>';
        return;
      }

      for (const p of filtered) {
        const card = document.createElement("article");
        card.className = "product-card";

        const imageContent = p.image
          ? `<img src="${p.image}" alt="${p.artist} - ${p.title}" />`
          : `<span>ジャケット画像<br />No Image</span>`;

        card.innerHTML = `
          <div class="product-image">
            ${imageContent}
          </div>
          <div class="product-meta">
            <div class="product-title">${p.title}</div>
            <div class="product-artist">${p.artist}</div>
            <div class="product-label">${p.label} / ${p.format}</div>
            <div class="product-bottom">
              <span class="product-price">${formatYen(p.price)}</span>
              <span class="product-condition">${p.condition}</span>
            </div>
            <div style="font-size:11px; color:#777;">在庫: ${p.stock}</div>
          </div>
          <button type="button" onclick="addToCart('${p.id}')">
            カートに入れる
          </button>
        `;
        listContainer.appendChild(card);
      }
    }

    function scrollToProducts() {
      const el = document.getElementById("product-list");
      if (!el) return;
      const y = el.getBoundingClientRect().top + window.scrollY - 70;
      window.scrollTo({ top: y, behavior: "smooth" });
    }

    function checkout() {
      alert("これはデモのため、実際の決済処理はありません。");
    }

    // ------------- 初期化 -------------
    function init() {
      loadCartFromStorage();
      renderProducts();
      renderCart();

      document.getElementById("search").addEventListener("input", renderProducts);
      document.getElementById("formatFilter").addEventListener("change", renderProducts);
      document.getElementById("sortBy").addEventListener("change", renderProducts);
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
