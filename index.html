<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>VERANDAH RECORD STORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f4f4f6;
      color: #222;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: #111;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header .logo {
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 14px;
      text-transform: uppercase;
    }

    header .nav-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    header .nav-right button {
      border: 1px solid #555;
      background: transparent;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }

    header .nav-right button:hover {
      background: #fff;
      color: #111;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr minmax(260px, 320px);
      gap: 20px;
      padding: 16px 20px 40px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .filters-and-products {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filters {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filters label {
      font-size: 12px;
      color: #666;
    }

    .filters input,
    .filters select {
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid #ccc;
      font-size: 12px;
      background: #fafafa;
    }

    .filters .search-input {
      flex: 1;
      min-width: 140px;
    }

    .products {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: #fafafa;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #555;
      text-align: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }

    .product-title {
      font-weight: 600;
      font-size: 13px;
    }

    .product-artist {
      color: #555;
      font-size: 12px;
    }

    .product-label {
      color: #888;
      font-size: 11px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .product-price {
      font-weight: 700;
      font-size: 13px;
    }

    .product-condition {
      font-size: 11px;
      color: #666;
    }

    .product-card button {
      margin-top: 6px;
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      width: 100%;
    }

    .product-card button:hover {
      opacity: 0.85;
    }

    .cart {
      background: #111;
      color: #fff;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 64px;
      max-height: calc(100vh - 80px);
      overflow: hidden;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .cart-header h2 {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .cart-header span {
      font-size: 11px;
      color: #aaa;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin: 4px 0;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px;
      padding: 6px 0;
      border-bottom: 1px solid #333;
      font-size: 11px;
    }
